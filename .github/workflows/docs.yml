name: Docs

on:
  pull_request:
    branches: [main]
    paths:
      - "lua/**"
  push:
    branches: [main]
    paths:
      - "lua/**"

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: nightly

      - name: Clone mini.doc
        run: git clone --depth 1 https://github.com/echasnovski/mini.doc deps/mini.doc

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Generate docs
        run: just docs

      - name: Check for doc drift
        run: |
          git diff --exit-code doc/wip.txt || {
            echo "::error::doc/wip.txt is out of date. Run 'just docs' and commit."
            exit 1
          }
